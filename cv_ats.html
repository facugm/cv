      roleLine: { es: 'Project Management Digital · Coordinación Interdisciplinaria · Gestión de Stakeholders · Operaciones Digitales',
                  en: 'Digital Project Management · Cross-functional Coordination · Stakeholder Management · Digital Operations' },
      summary: { es: 'Licenciado en Comunicación Social por la Universidad Nacional de Rosario, orientado a project management digital, coordinación interdisciplinaria y gestión de stakeholders. Coordino proyectos digitales de principio a fin, articulando equipos de Producto, Tecnología, Diseño y Servicios, ordenando flujos de trabajo y mejorando procesos. Mi formación técnica y experiencia en desarrollo full-stack me permiten dialogar con equipos técnicos y traducir necesidades entre negocio, producto y tecnología.',
                 en: 'Bachelor in Social Communication from the National University of Rosario, focused on digital project management, cross-functional coordination, and stakeholder management. I coordinate digital projects end to end, aligning Product, Technology, Design, and Services teams, organizing workflows, and improving processes. My technical background and hands-on full-stack development experience let me engage technical teams and translate needs between business, product, and technology.' },
      sections: ['profile', 'experience', 'skills', 'projects', 'education', 'languages'],
      skillsOrder: ['pm', 'web', 'mkt', 'content', 'design', 'social'],
      bulletOrder: { educativa: ['b4', 'b3', 'b5', 'b7', 'b1', 'b2', 'b6'] }
    }
  };

  // ============================================================
  // RENDER
  // ============================================================
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function L(obj, lang) { return obj[lang] !== undefined ? obj[lang] : obj.es; }

  function renderExperience(variant, lang) {
    var html = '';
    DATA.experiences.forEach(function (exp) {
      var order = (variant.bulletOrder && variant.bulletOrder[exp.id]) || Object.keys(exp.bullets);
      var date = lang === 'en' && exp.dateEn ? exp.dateEn : exp.date;
      var title = (variant.titleOverride && variant.titleOverride[exp.id]) || exp.title;
      html += '<h3>' + esc(L(title, lang)) + '</h3>';
      html += '<p class="meta">' + esc(date) + ' | ' + esc(exp.location) + '</p><ul>';
      order.forEach(function (id) {
        var ov = variant.bulletsOverride && variant.bulletsOverride[exp.id] && variant.bulletsOverride[exp.id][id];
        var src = ov || exp.bullets[id];
        if (src) html += '<li>' + esc(L(src, lang)) + '</li>';
      });
      html += '</ul>';
    });
    return html;
  }

  function renderProjects(lang) {
    var html = '';
    DATA.projects.forEach(function (p) {
      html += '<h3>' + esc(L(p.title, lang)) + '</h3>';
      html += '<p class="meta">' + esc(p.date) + '</p>';
      html += '<p class="role-detail"><span>' + esc(L(DATA.roleLabel, lang)) + '</span> ' + esc(L(p.role, lang)) + '</p><ul>';
      p.bullets.forEach(function (b) { html += '<li>' + esc(L(b, lang)) + '</li>'; });
      html += '</ul>';
    });
    return html;
  }

  function renderEducation(lang) {
    var html = '';
    DATA.education.forEach(function (e) {
      html += '<h3>' + esc(L(e.title, lang)) + '</h3>';
      html += '<p class="meta">' + esc(e.date) + '</p>';
      html += '<p>' + esc(L(e.detail, lang)) + '</p>';
    });
    return html;
  }

  function renderSkills(variant, lang) {
    var list = variant.skillsCustom || variant.skillsOrder.map(function (key) { return DATA.skills[key]; });
    return list.map(function (c) {
      return '<p class="skills-cat"><strong>' + esc(L(c.label, lang)) + ':</strong> ' + esc(L(c.items, lang)) + '</p>';
    }).join('');
  }

  function renderLanguages(lang) {
    return '<ul>' + DATA.languages.map(function (l) { return '<li>' + esc(L(l, lang)) + '</li>'; }).join('') + '</ul>';
  }

  function sectionHtml(key, variant, lang) {
    var h = '<h2>' + esc(L(DATA.headings[key], lang)) + '</h2>';
    if (key === 'profile')    return '<section>' + h + '<p>' + esc(L(variant.summary, lang)) + '</p></section>';
    if (key === 'experience') return '<section>' + h + renderExperience(variant, lang) + '</section>';
    if (key === 'projects')   return '<section>' + h + renderProjects(lang) + '</section>';
    if (key === 'education')  return '<section>' + h + renderEducation(lang) + '</section>';
    if (key === 'skills')     return '<section>' + h + renderSkills(variant, lang) + '</section>';
    if (key === 'languages')  return '<section>' + h + renderLanguages(lang) + '</section>';
    return '';
  }

  function pdfName(variant, lang) { return 'ATS ' + variant.pdfBase + ' ' + (lang === 'en' ? 'EN' : 'ES') + '.pdf'; }

  function renderResume(vKey, lang) {
    var variant = VARIANTS[vKey];
    document.documentElement.setAttribute('lang', lang);
    var other = lang === 'es' ? 'en' : 'es';
    var t = { back: lang === 'es' ? '← Versiones' : '← Versions',
              dl: lang === 'es' ? '↓ Descargar PDF' : '↓ Download PDF' };
    var bar =
      '<div class="bar">' +
        '<a href="cv_ats.html">' + t.back + '</a>' +
        '<a class="dl" href="' + encodeURI(pdfName(variant, lang)) + '" download>' + t.dl + '</a>' +
        '<button type="button" id="btnLang">' + (lang === 'es' ? 'EN' : 'ES') + '</button>' +
        '<span class="sep"></span>' +
        '<span class="tag">' + esc(L(variant.name, lang)) + '</span>' +
      '</div>';
    var body =
      '<header><h1>' + esc(DATA.name) + '</h1>' +
      '<p class="role-line">' + esc(L(variant.roleLine, lang)) + '</p>' +
      '<p class="contact-line">' + esc(DATA.contact) + '</p></header><main>' +
      variant.sections.map(function (k) { return sectionHtml(k, variant, lang); }).join('') +
      '</main>';
    document.getElementById('app').innerHTML = bar + body;
    document.getElementById('btnLang').addEventListener('click', function () {
      try { localStorage.setItem('cv_lang', other); } catch (e) {}
      location.search = '?v=' + vKey + '&lang=' + other;
    });
  }

  function renderChooser(lang) {
    document.documentElement.setAttribute('lang', lang);
    var t = lang === 'es'
      ? { title: 'CV ATS — Facundo García Mata', sub: 'Elegí la versión según el tipo de puesto. Mismo contenido, distinta presentación.', view: 'Ver online', dl: 'Descargar', langLbl: 'Idioma' }
      : { title: 'ATS Resume — Facundo García Mata', sub: 'Pick the version that fits the role. Same content, different presentation.', view: 'View online', dl: 'Download', langLbl: 'Language' };
    var cards = Object.keys(VARIANTS).map(function (vKey) {
      var v = VARIANTS[vKey];
      var roles = v.roles.map(function (r) { return '<span>' + esc(r) + '</span>'; }).join('');
      function link(href, text, cls, dl) {
        return '<a class="btn ' + cls + '" href="' + href + '"' + (dl ? ' download' : '') + '>' + text + '</a>';
      }
      function row(label, esA, enA) {
        return '<div class="row"><span class="lbl">' + label + '</span>' + esA + enA + '</div>';
      }
      return '<div class="card"><h2>' + esc(L(v.name, lang)) + '</h2>' +
        '<p class="for">' + esc(L(v.forRoles, lang)) + '</p>' +
        '<div class="roles">' + roles + '</div>' +
        '<div class="actions">' +
        row(t.view, link('cv_ats.html?v=' + vKey + '&lang=es', 'ES', '', false),
                    link('cv_ats.html?v=' + vKey + '&lang=en', 'EN', '', false)) +
        row(t.dl, link(encodeURI(pdfName(v, 'es')), 'ES', 'dl', true),
                  link(encodeURI(pdfName(v, 'en')), 'EN', 'dl', true)) +
        '</div></div>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<div class="bar"><a href="index.html">← Volver al CV</a>' +
      '<button type="button" id="btnLang">' + (lang === 'es' ? 'EN' : 'ES') + '</button>' +
      '<span class="sep"></span><span class="tag">' + t.langLbl + '</span></div>' +
      '<div class="chooser"><h1>' + esc(t.title) + '</h1><p class="sub">' + esc(t.sub) + '</p>' +
      '<div class="cards">' + cards + '</div></div>';
    document.getElementById('btnLang').addEventListener('click', function () {
      var other = lang === 'es' ? 'en' : 'es';
      try { localStorage.setItem('cv_lang', other); } catch (e) {}
      location.search = '?lang=' + other;
    });
  }

  // ============================================================
  // ROUTER — ?v=marketing|project & ?lang=es|en ; no v => chooser
  // ============================================================
  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  var lang = param('lang');
  if (lang !== 'es' && lang !== 'en') { try { lang = localStorage.getItem('cv_lang'); } catch (e) {} }
  if (lang !== 'es' && lang !== 'en') lang = 'es';
  var v = param('v');
  if (v && VARIANTS[v]) renderResume(v, lang); else renderChooser(lang);
})();
</script>
</body>
</html>
